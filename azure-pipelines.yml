trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

stages:
  - stage: TestAndRun
    displayName: 'Test and Run FizzBuzz'
    jobs:
      - job: FizzBuzzJob
        displayName: 'Unit Test & Execute FizzBuzz'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              pytest test_fizzbuzz.py -v --junitxml=junit/test-results.xml
            displayName: 'Run unit tests (pytest)'

          - task: PublishTestResults@2
            displayName: 'Publish JUnit test results to Azure DevOps'
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '**/test-results.xml'
              testRunTitle: 'FizzBuzz Pytest Suite'
              failTaskOnFailedTests: true

          - script: |
              python fizzbuzz.py
            displayName: 'Run FizzBuzz script'
            condition: succeeded()

